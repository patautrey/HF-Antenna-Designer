<script type="module">
    import antennaSelector from "./ui/antenna-selector.js";
    import runPanel from "./app/runPanel.js";
    import app from "./app/app.js";

    // Insert dropdown
    document.getElementById("selector").innerHTML = antennaSelector();

    // Dropdown change handler
    document.getElementById("antenna_select").onchange = () => {
        const panel = document.getElementById("antenna_select").value;
        runPanel(app, panel);
    };

    // Load default panel
    runPanel(app, "flowerpot");
</script>
