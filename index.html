<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HF Antenna Designer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f4f4f4;
    }
    h1, h2, h3 {
      margin-top: 20px;
      color: #1e3a5f;
    }
    #antennaSelect {
      padding: 8px;
      font-size: 16px;
      margin-bottom: 20px;
    }
    #antennaParams label {
      display: block;
      margin-top: 10px;
    }
    #antennaParams input {
      width: 200px;
      padding: 5px;
      margin-bottom: 10px;
    }
    button {
      margin-top: 15px;
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    pre {
      background: #fff;
      padding: 10px;
      border: 1px solid #ccc;
      overflow-x: auto;
    }
    #viewer3D, #radiation3D, #swrPlot {
      margin-top: 20px;
      background: #fff;
      padding: 10px;
      border: 1px solid #ccc;
    }
  </style>
</head>

<body>

  <h1>HF Antenna Designer</h1>

  <h2>Select Antenna</h2>
  <select id="antennaSelect">
    <option value="">-- Choose an antenna --</option>
  </select>

  <div id="antennaParams"></div>
  <div id="necDeck"></div>

  <!-- Load main JS entry point -->
  <script type="module" src="./ui/load-antenna.js"></script>

</body>
</html>
