<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HF Antenna Designer</title>

    <!-- Core Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/theme.css">

    <!-- App Loader -->
    <script type="module" src="js/master-index.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
        }
        header {
            background: #222;
            padding: 1rem;
            font-size: 1.6rem;
            font-weight: bold;
            text-align: center;
            border-bottom: 2px solid #444;
        }
        #app-container {
            display: flex;
            height: calc(100vh - 70px);
        }
        #sidebar {
            width: 280px;
            background: #1a1a1a;
            border-right: 2px solid #333;
            overflow-y: auto;
            padding: 1rem;
        }
        #content {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
        }
        .nav-section {
            margin-bottom: 1.5rem;
        }
        .nav-section h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.1rem;
            color: #66c0ff;
        }
        .nav-item {
            padding: 0.4rem 0;
            cursor: pointer;
            color: #ddd;
        }
        .nav-item:hover {
            color: #fff;
            text-decoration: underline;
        }
    </style>
</head>

<body>

<header>
    HF Antenna Designer
</header>

<div id="app-container">

    <!-- Sidebar (auto‑generated by master-index.js) -->
    <div id="sidebar">
        <div class="nav-section">
            <h3>Loading Modules…</h3>
            <div class="nav-item">Please wait</div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div id="content">
        <h2>Welcome to HF Antenna Designer</h2>
        <p>Select an antenna module from the sidebar to begin.</p>
    </div>

</div>

</body>
</html>
