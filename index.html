<script type="module">
    window.addEventListener("DOMContentLoaded", async () => {
        const { default: antennaSelector } = await import("./ui/antenna-selector.js");
        const { default: runPanel } = await import("./app/runPanel.js");
        const { default: app } = await import("./app/app.js");

        // Insert dropdown
        document.getElementById("selector").innerHTML = antennaSelector();

        // Dropdown change handler
        document.getElementById("antenna_select").onchange = () => {
            const panel = document.getElementById("antenna_select").value;
            runPanel(app, panel);
        };

        // Load default panel
        runPanel(app, "flowerpot");
    });
</script>
