<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HF Antenna Designer</title>
  <link rel="stylesheet" href="./assetts/workbench.css">
</head>

<body>
  <h1>HF Antenna Designer</h1>

  <div id="selector"></div>
  <hr>
  <div id="panel"></div>

  <script type="module">
    import antennaSelector from "./ui/antenna-selector.js";
    import { loadAntenna } from "./ui/load-antenna.js";
    import { renderAntenna } from "./ui/render-antenna.js";

    document.getElementById("selector").innerHTML = antennaSelector();

    document.getElementById("antenna_select").onchange = async () => {
      const name = document.getElementById("antenna_select").value;
      const data = await loadAntenna(name);
      renderAntenna(data);
    };

    loadAntenna("flowerpot").then(renderAntenna);
  </script>
</body>
</html>
